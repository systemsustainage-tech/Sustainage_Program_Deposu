{% extends "base.html" %}

{% block title %}{{ lang('login_page_title') }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">{{ lang('login_header') }}</h3>
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">{{ lang('login_username') }}</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ lang('login_password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    {% if show_captcha %}
                    <div class="mb-3">
                        <label class="form-label">{{ lang('security_check', 'Güvenlik Kontrolü') }}</label>
                        <div class="d-flex align-items-center mb-2">
                            <div id="captcha-question" class="form-control-plaintext border rounded px-3 me-2 fw-bold bg-light" style="width: auto;">
                                <!-- Loaded via JS -->
                                ...
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="loadCaptcha()">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <input type="text" class="form-control" name="captcha" placeholder="{{ lang('enter_captcha_result', 'İşlem sonucunu giriniz') }}" required>
                    </div>
                    <script>
                        function loadCaptcha() {
                            fetch("{{ url_for('captcha_image') }}")
                                .then(response => response.json())
                                .then(data => {
                                    document.getElementById('captcha-question').innerText = data.question;
                                })
                                .catch(err => console.error(err));
                        }
                        // Load on start
                        document.addEventListener('DOMContentLoaded', loadCaptcha);
                    </script>
                    {% endif %}
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">{{ lang('login_remember_me') }}</label>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">{{ lang('login_submit_button') }}</button>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">{{ lang('login_forgot_password_link') }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
