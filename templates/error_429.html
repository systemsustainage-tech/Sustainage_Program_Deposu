{% extends "base.html" %}

{% block title %}Çok Fazla İstek (429) - Sustainage{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-danger mb-4">429</div>
    <h1 class="h2 mb-4">Çok Fazla İstek</h1>
    <p class="lead mb-5">
        Kısa süre içinde çok fazla istek gönderdiniz.<br>
        Lütfen bir süre bekleyip tekrar deneyin.
    </p>
    {% if error %}
    <div class="alert alert-warning d-inline-block">
        {{ error }}
    </div>
    <br>
    {% endif %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">Ana Sayfaya Dön</a>
</div>
{% endblock %}
