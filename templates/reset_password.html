{% extends "base.html" %}

{% block title %}{{ lang('new_password_title') }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">{{ lang('set_new_password') }}</h3>
                
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ lang('new_password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">{{ lang('confirm_password') }}</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">{{ lang('change_password_btn') }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
